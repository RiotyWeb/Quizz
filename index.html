<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué tanto conoces a este sujeto?</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:Georgia,'Times New Roman',serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;max-width:560px;margin:0 auto;text-align:center}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.35rem;line-height:1.35;margin:0 0 1em}
.sub{font-size:1.2rem;color:#555;margin:0}
button{font:inherit;cursor:pointer}
.btn{background:#111;color:#fff;border:0;border-radius:8px;padding:.8em 2em;font-size:1.1rem;margin-top:1em}
.btn.alt{background:#fff;color:#111;border:2px solid #111}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #ccc;border-radius:10px;padding:.85em 1em;margin:.5em 0;font-size:1.05rem}
.opt:focus-visible,.btn:focus-visible{outline:3px solid #06c;outline-offset:2px}
.opt.sel{border-color:#111}
.opt.ok{background:#2e9e4f;border-color:#2e9e4f;color:#fff}
.opt.bad{background:#d93636;border-color:#d93636;color:#fff}
.opt:disabled{cursor:default}
.prog{color:#888;font-size:.9rem;margin-bottom:1em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.box{background:#fff;border-radius:14px;padding:24px;max-width:380px;width:100%}
.box p{font-size:1.2rem;margin:0 0 .5em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pct{font-size:3.2rem;margin:.1em 0}
input{font:inherit;font-size:1.1rem;padding:.7em;border:2px solid #ccc;border-radius:8px;width:100%;margin-top:1em}
.fade{animation:f .5s}@keyframes f{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function arrows(){let g='';for(let k=0;k<7;k++){g+=`<g transform="rotate(${k*360/7} 200 200)"><path d="M200 22V104M200 116L186 92M200 116L214 92" stroke="#d91f1f" stroke-width="9" stroke-linecap="round" fill="none"/></g>`}
return `<svg viewBox="0 0 400 400" width="320" height="320" role="img" aria-label="Siete flechas rojas apuntan a la foto"><defs><clipPath id="c"><circle cx="200" cy="200" r="64"/></clipPath></defs>${g}<image href="${IMG}" x="136" y="136" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#c)"/><circle cx="200" cy="200" r="64" fill="none" stroke="#111" stroke-width="3"/></svg>`}
function start(){A.className='fade';A.innerHTML=`<h1>¿Qué tanto conoces a este sujeto?</h1>${arrows()}<button class="btn" id="go">Empezar</button>`;go.onclick=()=>trans(0)}
function trans(s,after){const t=s==='end'?['Y finalmente','']:S[s];A.innerHTML=`<div class="fade"><h1>${t[0]}</h1><p class="sub">${t[1]}</p></div>`;
setTimeout(()=>{if(s==='end')result();else question()},2300)}

function modal(h){const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.innerHTML=`<div class="box">${h}</div>`;document.body.appendChild(m);return m}
function confirmPick(k,btn){btn.classList.add('sel');const m=modal(`<p>¿Estás seguro?</p><div class="row"><button class="btn" id="y">Enviar</button><button class="btn alt" id="n">Reconsiderar</button></div>`);

m.querySelector('#y').onclick=()=>{m.remove();answer(k)};m.querySelector('#y').focus()}
function answer(k){const o=Q[i][1][k];const ok=!!o[1];if(ok)score++;picked[i]=o[0];

function next(){i++;if(i===15)return trans('end');if(i===5)return trans(1);if(i===10)return trans(2);question()}
